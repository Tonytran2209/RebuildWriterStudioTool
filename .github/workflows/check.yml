name: Writer Studio checks
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: writer-studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  writer-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm --prefix backend test
      - run: npm run check

  browser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache pinned Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu24-chromium-${{ hashFiles('package-lock.json') }}
      - name: Prepare Chromium system dependencies
        timeout-minutes: 3
        run: npx --no-install playwright install-deps chromium
      - name: Prepare Chromium with bounded retry
        timeout-minutes: 3
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "30000"
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=10s 70s npx --no-install playwright install chromium; then
              exit 0
            fi
            echo "Chromium download attempt ${attempt} failed; retrying infrastructure only."
          done
          echo "::error title=CI infrastructure::Chromium download failed before browser tests."
          exit 1
      - run: npm run test:browser -- --reporter=list,html,./tests/agent-lab/evidence-reporter.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
